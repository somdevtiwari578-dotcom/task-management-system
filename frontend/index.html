<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center p-3">
<div class="auth-shell">
<div class="auth-brand"><div class="brand-mark">✓</div><h1>TaskFlow</h1><p>Simple task management for productive work.</p></div>
<div class="auth-card">
<h2>Welcome back</h2><p class="text-muted mb-4">Sign in to manage your tasks.</p>
<div id="alertBox"></div>
<form id="loginForm">
<div class="mb-3"><label for="email" class="form-label">Email address</label><input type="email" id="email" class="form-control" placeholder="you@example.com" required></div>
<div class="mb-3"><label for="password" class="form-label">Password</label><input type="password" id="password" class="form-control" placeholder="Enter your password" required></div>
<button type="submit" id="loginBtn" class="btn btn-primary w-100">Sign In</button>
</form>
<p class="text-center mt-4 mb-0">Don't have an account? <a href="register.html">Create account</a></p>
</div></div></main>
<script src="js/auth.js"></script>
</body></html>
