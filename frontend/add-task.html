<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow - Add Task</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page">
<nav class="navbar app-navbar"><div class="container"><a class="navbar-brand fw-bold" href="dashboard.html"><span class="brand-mini">✓</span> TaskFlow</a><button class="btn btn-outline-secondary btn-sm" id="logoutBtn">Logout</button></div></nav>
<main class="container py-4 py-lg-5"><div class="form-page">
<a href="dashboard.html" class="back-link"><i class="bi bi-arrow-left"></i> Back to dashboard</a>
<div class="page-heading compact"><span class="eyebrow">TASK MANAGEMENT</span><h1>Create a new task</h1><p>Add the details and set a priority for your work.</p></div>
<div id="alertBox"></div>
<div class="content-card"><form id="taskForm">
<div class="mb-4"><label class="form-label" for="title">Task title <span>*</span></label><input type="text" id="title" class="form-control" maxlength="150" placeholder="e.g. Complete project documentation" required></div>
<div class="mb-4"><label class="form-label" for="description">Description</label><textarea id="description" class="form-control" rows="5" maxlength="2000" placeholder="Add useful details about this task..."></textarea></div>
<div class="row g-3 mb-4"><div class="col-md-6"><label class="form-label" for="priority">Priority</label><select id="priority" class="form-select"><option value="LOW">Low</option><option value="MEDIUM" selected>Medium</option><option value="HIGH">High</option></select></div>
<div class="col-md-6"><label class="form-label" for="dueDate">Due date</label><input type="date" id="dueDate" class="form-control"></div></div>
<div class="d-flex justify-content-end gap-2"><a href="dashboard.html" class="btn btn-light border">Cancel</a><button type="submit" id="saveBtn" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Create Task</button></div>
</form></div></div></main>
<script src="js/tasks.js"></script>
</body></html>
