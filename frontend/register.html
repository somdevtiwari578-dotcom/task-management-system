<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow - Register</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center p-3">
<div class="auth-shell">
<div class="auth-brand"><div class="brand-mark">✓</div><h1>TaskFlow</h1><p>Organize your work. Stay focused.</p></div>
<div class="auth-card">
<h2>Create your account</h2><p class="text-muted mb-4">Start managing your tasks today.</p>
<div id="alertBox"></div>
<form id="registerForm">
<div class="mb-3"><label for="name" class="form-label">Full name</label><input type="text" id="name" class="form-control" placeholder="John Doe" maxlength="100" required></div>
<div class="mb-3"><label for="email" class="form-label">Email address</label><input type="email" id="email" class="form-control" placeholder="you@example.com" required></div>
<div class="mb-3"><label for="password" class="form-label">Password</label><input type="password" id="password" class="form-control" placeholder="Minimum 8 characters" minlength="8" required></div>
<button type="submit" id="registerBtn" class="btn btn-primary w-100">Create Account</button>
</form>
<p class="text-center mt-4 mb-0">Already have an account? <a href="index.html">Sign in</a></p>
</div></div></main>
<script src="js/auth.js"></script>
</body></html>
