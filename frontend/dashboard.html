<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow - Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page">
<nav class="navbar navbar-expand-lg app-navbar"><div class="container">
<a class="navbar-brand fw-bold" href="dashboard.html"><span class="brand-mini">✓</span> TaskFlow</a>
<div class="d-flex align-items-center gap-3"><span class="welcome-text" id="userName">User</span><button class="btn btn-outline-secondary btn-sm" id="logoutBtn"><i class="bi bi-box-arrow-right me-1"></i>Logout</button></div>
</div></nav>
<main class="container py-4 py-lg-5">
<div id="alertBox"></div>
<section class="page-heading d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
<div><span class="eyebrow">WORKSPACE</span><h1>Dashboard</h1><p>Track your work and keep your priorities clear.</p></div>
<a href="add-task.html" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i> Add Task</a>
</section>
<section class="row g-3 mb-4">
<div class="col-6 col-xl-3"><div class="stat-card"><div class="stat-icon total"><i class="bi bi-list-task"></i></div><div><span>Total Tasks</span><strong id="totalTasks">0</strong></div></div></div>
<div class="col-6 col-xl-3"><div class="stat-card"><div class="stat-icon pending"><i class="bi bi-hourglass-split"></i></div><div><span>Pending</span><strong id="pendingTasks">0</strong></div></div></div>
<div class="col-6 col-xl-3"><div class="stat-card"><div class="stat-icon progress"><i class="bi bi-arrow-repeat"></i></div><div><span>In Progress</span><strong id="inProgressTasks">0</strong></div></div></div>
<div class="col-6 col-xl-3"><div class="stat-card"><div class="stat-icon completed"><i class="bi bi-check2-circle"></i></div><div><span>Completed</span><strong id="completedTasks">0</strong></div></div></div>
</section>
<section class="content-card">
<div class="content-card-header"><div><h2>Your Tasks</h2><p>Manage your current work items.</p></div><button class="btn btn-light border" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i></button></div>
<div id="tasksContainer" class="tasks-list"><div class="loading-state"><div class="spinner-border spinner-border-sm"></div> Loading tasks...</div></div>
</section>
</main>
<script src="js/dashboard.js"></script>
</body></html>
